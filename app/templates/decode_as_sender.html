<!DOCTYPE html>
<html lang="en">
    {% include '_partial_head.html' %}
    <body onload="loadUserDataIntoForm()">
        {% include '_partial_header.html' %}
        <h1>Decode your own Secret</h1>

        <form action="/decoded_as_sender" method="post" onsubmit="onDecode(event)" id="formDecode">
            <label for="secret">Secret:</label>
            <input type="text" id="secret" name="secret" required>
            <input type="hidden" id="username" name="username" required>
            <input type="hidden" id="secret_s" name="secret_s" required>
            <input type="hidden" id="secret_sa" name="secret_sa" required>
            <input type="hidden" id="secret_i" name="secret_i" required>
            <input type="hidden" id="secret_c" name="secret_c" required>
            <input type="hidden" id="username" name="username" required>
            <button type="submit">Decode</button>
        </form>
    <br>
    <br>
    {% include '_partial_footer.html' %}
    </body>
</html>
